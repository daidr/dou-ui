name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pull requests from forks never run on the self-hosted machine. Release
    # pull requests only change versions and the changelog on top of a main
    # that CI already checked, and release.yml builds and packs them again
    # before publishing; a skipped job still counts as passing for required
    # checks.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-pr/'))
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          # the icon check compares the branch with its base to find the pages it touches
          fetch-depth: 0

      # vue-tsc and other tools run on Node; without it bun stands in and vue-tsc cannot read .vue files
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun fmt --check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build docs
        run: bun run docs:build

      # icons sized or centered unlike their neighbours, on the pages this pull request touches
      - name: Icon check
        if: github.event_name == 'pull_request'
        run: |
          bunx playwright install chromium
          (cd docs && bunx vitepress preview --port 4173 > /dev/null 2>&1 &)
          for i in $(seq 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          status=0
          bun run audit:icons --open --changed origin/${{ github.base_ref }} --url http://localhost:4173 || status=$?
          # the bracket keeps pkill from matching this script itself
          pkill -f "vitepress preview --port 417[3]" || true
          exit $status

  bench:
    # Pull requests from forks never run on the self-hosted machine. Release
    # pull requests only change versions and the changelog on top of a main
    # that CI already checked, and release.yml builds and packs them again
    # before publishing; a skipped job still counts as passing for required
    # checks.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-pr/'))
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # the browser is kept between runs on the runner, so this is quick after the first
      - run: bunx playwright install chromium

      # the cases with a budget (frame times of large charts): fails when one is over it
      - name: Bench
        run: bun run bench:check
