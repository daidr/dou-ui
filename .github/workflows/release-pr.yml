# Keep one "release: vX.Y.Z-alpha.N" pull request open for the next
# prerelease. Every push to main rebuilds it on top of the new main (force
# pushing the same branch and updating the same pull request); merging it
# starts release.yml, which publishes it. Releases (`latest`) and the first
# beta are still prepared by hand with release-prepare.yml.
name: Release PR

on:
  push:
    branches: [main]
  # once a release is tagged, propose the next one without waiting for a push
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

# only the newest main matters; an older run would push a stale branch
concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: release-pr/next

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # the changelog script reads which pull request added each fragment,
          # and the plan checks the previous version's tag
          fetch-depth: 0
          # the write token is handed to the push step only, not to bun install
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Plan
        id: plan
        run: bun scripts/release/auto.ts

      - name: Bump versions and write the changelog
        if: steps.plan.outputs.version != ''
        env:
          GITHUB_REF_NAME: main
        run: bun run release "${{ steps.plan.outputs.version }}"

      - name: Push the release branch
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A packages bun.lock CHANGELOG.md .changes
          git commit -m "release: v$VERSION"
          # the branch only ever holds this one generated commit on top of main
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$BRANCH"

      - name: Open or update the pull request
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          WAITING: ${{ steps.plan.outputs.waiting }}
        with:
          script: |
            const fs = require('node:fs')
            const version = process.env.VERSION
            const branch = process.env.BRANCH
            const { data: open } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            })
            const existing = open[0]
            if (!version) {
              // Nothing left to release: a stable release from "Prepare
              // release" took every fragment, so this proposal is stale.
              if (existing && process.env.WAITING !== 'true') {
                await github.rest.pulls.update({ ...context.repo, pull_number: existing.number, state: 'closed' })
                core.notice(`没有待发布的改动，已关闭 ${existing.html_url}`)
              }
              return
            }
            const notes = fs.readFileSync('.release/notes.md', 'utf8')
            const sha = (await exec.getExecOutput('git', ['rev-parse', 'HEAD~1'])).stdout.trim()
            const body = [
              `合并后，发版工作流会构建并把 ${version} 发布到 npm（预览版，npm 标签 \`alpha\`/\`beta\`）。`,
              `这个 PR 由工作流维护：main 每次更新都会在最新的 main（当前 ${sha.slice(0, 7)}）上重新生成，并覆盖这里的修改。想改更新日志，请改 \`.changes/\` 里的文件。`,
              '不想发布就不用管它，改动会继续累积到下一次合并。',
              '',
              '---',
              '',
              notes,
            ].join('\n')
            const title = `release: v${version}`
            if (existing) {
              await github.rest.pulls.update({ ...context.repo, pull_number: existing.number, title, body })
              core.notice(`已更新 ${existing.html_url}`)
            } else {
              const { data } = await github.rest.pulls.create({
                ...context.repo,
                head: branch,
                base: 'main',
                title,
                body,
              })
              core.notice(`已创建 ${data.html_url}`)
            }
